<style>
/* Layout: picture-tile menu over a candy backdrop; each game is one full-screen canvas with a star counter (top-left) and home + sound buttons (top-right) */
:root{
  --ink:#3A3355; --cream:#FFFDF6; --pink:#FF6F91; --sun:#FFD93D; --sky:#BDE8FF; --blush:#FFE1EE;
  --font:"Jua","Arial Rounded MT Bold","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c3{position:fixed;inset:0;width:100%;height:100%;display:block}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:8px;background:var(--cream);border:4px solid var(--ink);border-radius:999px;
  padding:6px 18px 6px 10px;font-size:34px;line-height:1;box-shadow:0 5px 0 var(--ink);pointer-events:none;
  font-variant-numeric:tabular-nums;transition:transform .15s}
.hud.bump{transform:scale(1.18) rotate(-4deg)}
.hud svg{width:38px;height:38px}
.btns{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));display:flex;gap:12px}
.rb{width:64px;height:64px;border-radius:50%;border:4px solid var(--ink);background:var(--cream);box-shadow:0 5px 0 var(--ink);
  display:grid;place-items:center;cursor:pointer;padding:0}
.rb:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.rb svg{width:34px;height:34px}
.rb:focus-visible,.tile:focus-visible{outline:4px dashed var(--pink);outline-offset:4px}
.room{position:fixed;inset:0;overflow-y:auto;background:#FFF4EC;
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.room[data-cat="shoot"]{background:linear-gradient(transparent 82%,#E8B77A 82%),repeating-linear-gradient(90deg,#FFD0D8 0 44px,#FFF4EC 44px 88px)}
.room[data-cat="learn"]{background:linear-gradient(transparent 82%,#D9A86C 82%),linear-gradient(rgba(61,123,255,.1) 2px,transparent 2px) 0 0/30px 30px,linear-gradient(90deg,rgba(61,123,255,.1) 2px,transparent 2px) 0 0/30px 30px,#EEF7FF}
.room[data-cat="puzzle"]{background:linear-gradient(transparent 82%,#9FD9C9 82%),radial-gradient(circle at 22px 22px,rgba(255,179,77,.35) 7px,transparent 8px) 0 0/44px 44px,#FFF6DA}
.room[data-cat="color"]{background:linear-gradient(transparent 82%,#E8D6FF 82%),radial-gradient(circle at 14px 14px,rgba(255,111,145,.3) 6px,transparent 7px) 0 0/56px 56px,radial-gradient(circle at 42px 40px,rgba(61,123,255,.25) 6px,transparent 7px) 0 0/56px 56px,#FBF6FF}
.room-in{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.room-head{display:flex;align-items:center;gap:14px;padding-right:80px;min-height:64px}
.room h1{margin:0;font-weight:400;font-size:clamp(26px,6vw,44px);color:var(--ink);background:var(--cream);border:4px solid var(--ink);border-radius:999px;padding:2px 24px;box-shadow:0 5px 0 var(--ink);white-space:nowrap}
.back{display:flex;align-items:center;gap:6px;height:60px;padding:0 18px 0 12px;border-radius:999px;border:4px solid var(--ink);background:var(--cream);box-shadow:0 5px 0 var(--ink);
  font-family:var(--font);font-size:clamp(18px,4.5vw,24px);color:var(--ink);cursor:pointer;flex:none}
.back svg{width:32px;height:32px}
.pop{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,10,40,.55);z-index:5;overflow-y:auto;
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pop-card{width:min(420px,100%);background:var(--cream);border:5px solid var(--ink);border-radius:32px;box-shadow:0 10px 0 var(--ink);padding:18px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;animation:popin .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.3) rotate(-6deg);opacity:0}}
.pop-title{font-size:clamp(42px,12vw,66px);line-height:1;color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);letter-spacing:.02em}
.pop[data-mode="lose"] .pop-title{color:#8AD8FF}
#popArt{width:230px;height:210px;max-width:100%}
.pop-sub{font-size:clamp(18px,4.8vw,24px);text-wrap:balance}
.pop-reward{display:flex;flex-direction:column;align-items:center;gap:2px}
.pop-reward b{font-weight:400;font-size:clamp(32px,9vw,44px);line-height:1.1;color:#FFB800;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.pop-reward small{font-size:16px;color:#6B6585}
.pop-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.hud{z-index:7}
.starbtn{display:flex;align-items:center;gap:10px;padding:8px 22px 8px 12px;border-radius:999px;border:4px solid var(--ink);background:#FFF6C2;box-shadow:0 6px 0 var(--ink);cursor:pointer;font-family:var(--font);animation:starpulse 1s ease-in-out infinite}
.starbtn svg{width:58px;height:58px;animation:starspin 2.4s linear infinite}
.starbtn b{font-weight:400;font-size:clamp(30px,8vw,40px);color:#FFB800;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.starbtn.got{animation:none;opacity:.55;cursor:default}
.starbtn.got svg{animation:none}
.starbtn:focus-visible{outline:4px dashed var(--pink);outline-offset:4px}
@keyframes starpulse{50%{transform:scale(1.08)}}
@keyframes starspin{to{transform:rotate(360deg)}}
.flystar{position:fixed;left:0;top:0;width:36px;height:36px;margin:-18px 0 0 -18px;z-index:9;pointer-events:none}
.flystar svg{width:100%;height:100%;display:block}
@media (prefers-reduced-motion:reduce){.starbtn,.starbtn svg{animation:none}}
.pbtn{font-family:var(--font);font-size:clamp(20px,5.2vw,26px);padding:10px 22px;border-radius:999px;border:4px solid var(--ink);background:#5CCB5F;color:#fff;box-shadow:0 6px 0 var(--ink);cursor:pointer;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.pbtn.alt{background:#FFFFFF;color:var(--ink);-webkit-text-stroke:0}
.pbtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.pbtn:focus-visible{outline:4px dashed var(--pink);outline-offset:4px}
@media (prefers-reduced-motion:reduce){.pop-card{animation:none}}
.back:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.back:focus-visible{outline:4px dashed var(--pink);outline-offset:4px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;width:100%}
@media (max-width:640px){.grid{gap:10px}.tile{border-width:4px;border-radius:20px;box-shadow:0 6px 0 var(--ink)}.tile canvas{border-bottom-width:4px}}
.tile{min-width:0;border:5px solid var(--ink);border-radius:28px;background:var(--cream);box-shadow:0 8px 0 var(--ink);
  padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;font-family:var(--font);color:var(--ink);transition:transform .12s}
.tile:hover{transform:translateY(-3px) rotate(-1deg)}
.tile:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.tile canvas{width:100%;aspect-ratio:4/3;max-width:100%;display:block;border-bottom:5px solid var(--ink)}
.tile span{font-size:clamp(15px,3.9vw,28px);padding:10px 8px 12px;background:var(--tc)}
@media (prefers-reduced-motion:reduce){.tile,.hud{transition:none}}
</style>

<canvas id="c3" hidden aria-hidden="true"></canvas>
<canvas id="c" aria-label="게임 화면"></canvas>

<div class="hud" id="hud" hidden aria-live="polite">
  <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l5.2 10.6 11.6 1.7-8.4 8.2 2 11.6L20 29.6 9.6 35.1l2-11.6L3.2 15.3l11.6-1.7z" fill="#FFD93D" stroke="#3A3355" stroke-width="3" stroke-linejoin="round"/></svg>
  <span id="score">0</span>
</div>

<div class="btns">
  <button class="rb" id="home" hidden aria-label="놀이방으로">
    <svg viewBox="0 0 34 34" aria-hidden="true"><path d="M5 16L17 5l12 11v13H21v-8h-8v8H5z" fill="#FF8FB1" stroke="#3A3355" stroke-width="2.8" stroke-linejoin="round"/></svg>
  </button>
  <button class="rb" id="snd" aria-label="소리 끄기"><svg viewBox="0 0 34 34" aria-hidden="true" id="sndIcon"></svg></button>
</div>

<div class="pop" id="pop" hidden>
  <div class="pop-card" role="dialog" aria-labelledby="popTitle">
    <div class="pop-title" id="popTitle">VICTORY!</div>
    <canvas id="popArt" aria-hidden="true"></canvas>
    <div class="pop-sub" id="popSub"></div>
    <div class="pop-reward" id="popReward"></div>
    <div class="pop-btns"><button class="pbtn alt" id="popHome">놀이방</button><button class="pbtn" id="popGo">다음 단계 ▶</button></div>
  </div>
</div>

<div class="room" id="room" hidden>
  <div class="room-in">
    <div class="room-head">
      <button class="back" id="back" aria-label="마을로 돌아가기"><svg viewBox="0 0 34 34" aria-hidden="true"><path d="M5 16L17 5l12 11v13H21v-8h-8v8H5z" fill="#FF8FB1" stroke="#3A3355" stroke-width="2.8" stroke-linejoin="round"/></svg><span>마을로</span></button>
      <h1 id="roomTitle"></h1>
    </div>
    <div class="grid" id="roomGrid"></div>
  </div>
</div>

<script>
(()=>{
/* =================== Core =================== */
const cv=document.getElementById('c'),G=cv.getContext('2d');
let g=G,W=0,H=0,S=1,DPR=1,time=0;
const INK='#3A3355',FONT='"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const CANDY=['#FF8FB1','#6FD6B4','#B9A2F2','#FFB37A','#7CC7FF','#FFD93D'];
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[(Math.random()*a.length)|0],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function line(w,c=INK){g.lineWidth=w*S;g.strokeStyle=c;g.lineJoin='round';g.lineCap='round'}
function circ(x,y,r){g.beginPath();g.arc(x,y,Math.max(0,r),0,7)}
function easeBack(t){const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}
const popScale=t=>t.state==='in'?easeBack(Math.min(1,t.t/.4)):1;
function blinker(t,dt){t.blink-=dt;if(t.blink<0){t.blinkT=.14;t.blink=rnd(2,4.5)}t.blinkT-=dt}
function glow(x,y,r,c){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,c);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
function starPath(R,ir){g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?ir:R;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath()}
function heartPath(s){g.beginPath();g.moveTo(0,s*.75);g.bezierCurveTo(-s*1.5,-s*.1,-s*.75,-s*1.25,0,-s*.45);g.bezierCurveTo(s*.75,-s*1.25,s*1.5,-s*.1,0,s*.75);g.closePath()}
function cloud(x,y,s,a=.95){g.fillStyle=`rgba(255,255,255,${a})`;g.beginPath();[[0,0,30],[28,-12,26],[54,0,28],[26,8,26]].forEach(([p,q,r])=>{g.moveTo(x+(p+r)*s,y+q*s);g.arc(x+p*s,y+q*s,r*s,0,7)});g.fill()}

/* faces: mood = smile | happy | sleep | open | chomp */
function eyes(r,mood,blink,col=INK,n=2){
  const ey=-r*.08,es=r*.13,xs=n===1?[0]:n===3?[-r*.36,0,r*.36]:[-r*.3,r*.3],big=n===1?1.7:1;
  xs.forEach((ex,k)=>{const y=ey-(n===3&&k===1?r*.14:0),s=es*big;
    if(mood==='happy'||mood==='chomp'){line(3.5,col);g.beginPath();g.moveTo(ex-s,y+s*.35);g.lineTo(ex,y-s*.55);g.lineTo(ex+s,y+s*.35);g.stroke()}
    else if(mood==='sleep'){line(3.5,col);g.beginPath();g.arc(ex,y-s*.3,s*.9,.15*Math.PI,.85*Math.PI);g.stroke()}
    else if(blink){line(3.5,col);g.beginPath();g.moveTo(ex-s,y);g.lineTo(ex+s,y);g.stroke()}
    else{if(n===1){g.fillStyle='#fff';circ(ex,y,s*1.35);g.fill();line(3,col);g.stroke()}
      g.fillStyle=col;circ(ex,y,s);g.fill();g.fillStyle='#fff';circ(ex-s*.35,y-s*.4,s*.4);g.fill()}
  });
}
function mouth(r,mood,my=r*.16){
  line(3.5);
  if(mood==='happy'){g.fillStyle='#FF6B8A';g.beginPath();g.arc(0,my,r*.17,0,Math.PI);g.closePath();g.fill();g.stroke()}
  else if(mood==='open'){const w=1+Math.sin(time*10)*.1;g.fillStyle='#5B1F3A';g.beginPath();g.ellipse(0,my+r*.1,r*.23,r*.25*w,0,0,7);g.fill();g.stroke();
    g.fillStyle='#FF7B9C';g.beginPath();g.ellipse(0,my+r*.25,r*.13,r*.07,0,0,7);g.fill()}
  else if(mood==='chomp'){g.beginPath();g.moveTo(-r*.2,my);g.quadraticCurveTo(-r*.1,my+r*.13,0,my);g.quadraticCurveTo(r*.1,my+r*.13,r*.2,my);g.stroke()}
  else if(mood==='sleep'){circ(0,my,r*.06);g.stroke()}
  else{g.beginPath();g.arc(0,my-r*.04,r*.13,.15*Math.PI,.85*Math.PI);g.stroke()}
}
function face(r,o={}){
  const m=o.mood||'smile';eyes(r,m,o.blink,o.eyeCol,o.n);
  const big=m==='chomp';g.fillStyle='rgba(255,90,140,.45)';
  [-1,1].forEach(s=>{g.beginPath();g.ellipse(s*r*.5,r*.15,big?r*.21:r*.14,big?r*.18:r*.09,0,0,7);g.fill()});
  if(!o.noMouth)mouth(r,m,o.my);
}

/* =================== Sound (all synthesized) =================== */
let ac=null,master=null,musicGain=null,muted=false,noiseBuf=null,mus=null,mStep=0,nextT=0;
function initAudio(){
  if(ac){if(ac.state==='suspended')ac.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  ac=new AC();master=ac.createGain();master.gain.value=muted?0:.8;master.connect(ac.destination);
  musicGain=ac.createGain();musicGain.gain.value=.55;musicGain.connect(master);
  noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  nextT=ac.currentTime+.2;
  setInterval(()=>{if(!mus)return;while(nextT<ac.currentTime+.4){const n=mus.mel[mStep%mus.mel.length];
    if(n!==null)tone(freq(n+12*(mus.oct||0)),nextT,mus.step*2,mus.wave,mus.vol,musicGain);
    if(mStep%4===0&&mus.bass)tone(freq(mus.bass[(mStep/4|0)%mus.bass.length]),nextT,mus.step*4,'sine',.07,musicGain);
    mStep++;nextT+=mus.step}},100);
}
const freq=s=>523.25*Math.pow(2,s/12);
function tone(f,t0,dur,type='sine',vol=.25,dest,slide){
  if(!ac)return;const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur*.8);
  v.gain.setValueAtTime(.0001,t0);v.gain.exponentialRampToValueAtTime(vol,t0+.012);v.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(v);v.connect(dest||master);o.start(t0);o.stop(t0+dur+.05);
}
function noise(t0,dur,vol,type='lowpass',f=1000,q=1){
  if(!ac)return;const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),v=ac.createGain();s.buffer=noiseBuf;
  fl.type=type;fl.frequency.value=f;fl.Q.value=q;v.gain.setValueAtTime(vol,t0);v.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(fl);fl.connect(v);v.connect(master);s.start(t0,Math.random()*.5);s.stop(t0+dur+.05);
}
const now=()=>ac?ac.currentTime:0;
const SCALE=[0,2,4,7,9,12,14,16,19,21,24];let noteIx=0;
function sNote(type='triangle'){if(!ac)return;const t=now(),s=SCALE[noteIx++%SCALE.length];tone(freq(s),t,.5,type,.28);tone(freq(s+12),t,.35,'sine',.08);[0,1,2].forEach(i=>tone(freq(s+24+i*4),t+.06+i*.05,.18,'sine',.05))}
function sGiggle(){if(!ac)return;const t=now()+.12;[0,1,2,3].forEach(i=>tone(700+i*140,t+i*.075,.07,'sine',.12,null,1000+i*160))}
function sFanfare(){if(!ac)return;const t=now()+.05;[0,4,7,12,7,12,16].forEach((s,i)=>{tone(freq(s),t+i*.11,.32,'square',.05);tone(freq(s),t+i*.11,.4,'triangle',.18)});tone(freq(24),t+.8,.9,'sine',.15)}
function setMusic(m){mus=m;mStep=0;if(ac)nextT=ac.currentTime+.15}

/* =================== Shared game state =================== */
let theme=null,gen=0,score=0,shown=0,P=[],parts=[],flyers=[],texts=[],bannerT=0,bannerText='',lastTap=0,aim=0,recoil=0,happy=0;
function later(fn,ms){const my=gen;setTimeout(()=>{if(gen===my&&theme)fn()},ms)}
function burst(x,y,n,o){for(let i=0;i<n;i++){const a=Math.random()*6.283,sp=rnd(o.min||120,o.max||360)*S;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(o.up||0)*S,life:0,max:rnd(.6,1.1)*(o.dur||1),kind:typeof o.kind==='function'?o.kind(i):o.kind||'dot',
    color:pick(o.colors||CANDY),size:rnd(6,13)*S*(o.scale||1),rot:Math.random()*6,vr:rnd(-10,10),g:o.g??300})}}
function say(text,x,y,color='#FFD93D'){texts.push({text,x,y,color,life:0})}
function banner(t){bannerT=2.4;bannerText=t}
const CHEERS=['최고야!','잘했어!','우와!','짱이야!','멋져!'];
function celebrate(){banner(CHEERS[((score/10)-1)%CHEERS.length]);sFanfare();
  for(let i=0;i<110;i++)parts.push({x:Math.random()*W,y:-20-Math.random()*H*.4,vx:rnd(-40,40),vy:rnd(60,180)*S,life:0,max:rnd(3,4),
    kind:Math.random()<.3?'star':'conf',color:pick(CANDY),size:rnd(7,14)*S,rot:Math.random()*6,vr:rnd(-4,4),g:40});
  theme.celebrate&&theme.celebrate()}

/* =================== Painted backdrops (cached per screen size) =================== */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function vgrad(y0,y1,stops){const gr=g.createLinearGradient(0,y0,0,y1);stops.forEach((c,i)=>gr.addColorStop(i/(stops.length-1),c));return gr}
